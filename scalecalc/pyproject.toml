[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scalecalc"
version = "0.1.0"
description = "An executable companion to the scaling-book roofline math: model FLOPs/memory, communication cost, and parallelism strategy recommendations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
web = [
    "marimo>=0.9",
    "plotly>=5.20",
]

[project.scripts]
scalecalc = "scalecalc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scalecalc"]
